<div class="login-page">

  <div class="login-card">

    <div class="login-header">

      <h1>Welcome back</h1>

      <p>
        Sign in to your incident management account.
      </p>

    </div>


    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="loginRequest.email"
          placeholder="Enter your email"
          autocomplete="email"
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="loginRequest.password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />

      </div>


      <div
        *ngIf="errorMessage"
        class="error-message">

        {{ errorMessage }}

      </div>


      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading">

        <span *ngIf="!isLoading">
          Login
        </span>

        <span *ngIf="isLoading">
          Signing in...
        </span>

      </button>

    </form>


    <div class="register-section">

      <span>
        Don't have an account?
      </span>

      <button
        type="button"
        class="register-link"
        (click)="goToRegister()">

        Create account

      </button>

    </div>

  </div>

</div>
